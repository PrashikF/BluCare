<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BluCare+</title>
    
    <!-- Prevent Flash of Unstyled Theme -->
    <script>
        const THEME_KEY = 'blucare_theme';
        const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Standard Dark Theme (Default) */
            --bg-base: #0F0F12;
            --bg-surface: #15151A;
            --bg-card: #1B1B22;
            --accent-sage: #7FE1C3;
            --accent-lavender: #B6C4FF;
            --accent-aqua: #A3E8ED;
            --text-primary: #ECECF1;
            --text-secondary: #B8BAC7;
            --text-subdued: #8A8D9E;
            --status-normal: #8FE3B0;
            --status-risk: #F29B9B;
            --shadow-base: 0 12px 40px rgba(0, 0, 0, 0.4);

            /* Component Backgrounds & Borders */
            --nav-bg: rgba(15, 15, 18, 0.8);
            --border-light: rgba(255, 255, 255, 0.05);
            --border-focus: rgba(182, 196, 255, 0.3);
            --btn-hover-bg: rgba(255, 255, 255, 0.1);
            --input-bg: #18181F;

            /* Glows & Hover States */
            --glow-sage: rgba(127, 225, 195, 0.25);
            --glow-lavender: rgba(182, 196, 255, 0.15);
        }

        [data-theme="light"] {
            /* Crisp Light Theme */
            --bg-base: #F8FAFC;
            --bg-surface: #F1F5F9;
            --bg-card: #FFFFFF;
            --accent-sage: #14B8A6;
            --accent-lavender: #6366F1;
            --accent-aqua: #06B6D4;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-subdued: #64748B;
            --status-normal: #10B981;
            --status-risk: #EF4444;
            --shadow-base: 0 12px 40px rgba(0, 0, 0, 0.05);

            /* Component Backgrounds & Borders */
            --nav-bg: rgba(248, 250, 252, 0.85);
            --border-light: rgba(15, 23, 42, 0.08);
            --border-focus: rgba(99, 102, 241, 0.3);
            --btn-hover-bg: rgba(15, 23, 42, 0.05);
            --input-bg: #FFFFFF;

            /* Glows & Hover States */
            --glow-sage: rgba(20, 184, 166, 0.25);
            --glow-lavender: rgba(99, 102, 241, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* --- Ambient Background Glow --- */
        .ambient-background {
            position: fixed;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80vw; height: 80vh;
            background: linear-gradient(120deg, var(--accent-sage), var(--accent-lavender), var(--accent-aqua), var(--accent-sage));
            background-size: 300% 300%;
            filter: blur(140px); opacity: 0.12; z-index: -1;
            animation: breathe 12s ease-in-out infinite alternate;
            pointer-events: none; transition: opacity 0.6s ease;
        }[data-theme="light"] .ambient-background { opacity: 0.15; filter: blur(120px); }

        @keyframes breathe {
            0% { background-position: 0% 50%; transform: translate(-50%, -48%) scale(0.95); }
            100% { background-position: 100% 50%; transform: translate(-50%, -52%) scale(1.05); }
        }

        /* --- Navigation --- */
        nav {
            position: fixed; top: 0; left: 0; right: 0; height: 80px; padding: 0 40px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 100; background: transparent;
        }

        .brand {
            font-weight: 500; font-size: 1.1rem; letter-spacing: -0.01em;
            color: var(--text-primary); display: flex; align-items: center; gap: 12px;
            text-decoration: none;
        }

        .brand-dot {
            width: 8px; height: 8px; background: var(--accent-sage); border-radius: 50%;
            box-shadow: 0 0 15px var(--glow-sage);
        }

        .nav-right { display: flex; align-items: center; gap: 32px; }
        .nav-links a {
            color: var(--text-subdued); text-decoration: none; font-size: 0.9rem;
            transition: color 0.3s ease; cursor: pointer; display: flex; align-items: center; gap: 6px;
        }
        .nav-links a:hover { color: var(--accent-lavender); }

        .theme-toggle {
            background: transparent; border: none; color: var(--text-subdued);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: color 0.3s ease; margin-left: 8px;
        }
        .theme-toggle:hover { color: var(--accent-lavender); }
        .theme-toggle svg { width: 18px; height: 18px; }

        /* --- Main Content --- */
        main {
            flex-grow: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 100px 20px 40px 20px; z-index: 10;
        }

        /* --- Auth Card --- */
        .auth-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 24px; padding: 48px 40px;
            width: 100%; max-width: 440px;
            box-shadow: var(--shadow-base);
            opacity: 0; transform: translateY(15px);
            animation: fadeUp 0.6s ease forwards 0.1s;
            position: relative; overflow: hidden;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .auth-header {
            text-align: center; margin-bottom: 32px;
        }

        .auth-title {
            font-size: 1.5rem; font-weight: 400; color: var(--text-primary);
            margin-bottom: 8px; letter-spacing: -0.01em;
        }

        .auth-subtitle {
            font-size: 0.95rem; color: var(--text-subdued); font-weight: 300;
        }

        /* --- Form Transitions --- */
        .form-container { position: relative; }
        
        .auth-form {
            display: flex; flex-direction: column; gap: 20px;
            transition: opacity 0.4s ease, transform 0.4s ease;
            width: 100%;
        }

        /* Hidden state for the form not currently active */
        .auth-form.hidden {
            position: absolute; top: 0; left: 0;
            opacity: 0; pointer-events: none;
            transform: translateY(10px);
        }

        .auth-form.active {
            position: relative; opacity: 1; pointer-events: all;
            transform: translateY(0);
        }

        /* --- Input Fields --- */
        .input-group { display: flex; flex-direction: column; gap: 8px; text-align: left; }
        .input-group label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 400; }
        
        .input-wrapper { position: relative; display: flex; align-items: center; }

        .auth-input {
            width: 100%; background-color: var(--input-bg);
            color: var(--text-primary); font-family: inherit; font-size: 0.95rem;
            border: 1px solid var(--border-light); border-radius: 12px;
            padding: 14px 16px; outline: none;
            transition: all 0.3s ease;
        }

        .auth-input::placeholder { color: var(--text-subdued); font-weight: 300; }
        
        .auth-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--glow-lavender);
        }

        /* Password Show/Hide Toggle */
        .password-toggle {
            position: absolute; right: 12px; background: transparent; border: none;
            color: var(--text-subdued); cursor: pointer; display: flex;
            align-items: center; justify-content: center; padding: 4px;
            transition: color 0.2s ease;
        }
        .password-toggle:hover { color: var(--text-primary); }

        .forgot-link {
            font-size: 0.8rem; color: var(--text-subdued); text-decoration: none;
            align-self: flex-start; transition: color 0.2s ease; margin-top: -8px;
        }
        .forgot-link:hover { color: var(--accent-lavender); }

        /* --- Call to Action Button --- */
        .auth-btn {
            background-color: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border-light);
            padding: 16px; border-radius: 100px;
            font-size: 1rem; font-weight: 400; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 8px; width: 100%;
        }

        .auth-btn:hover {
            background-color: var(--bg-card);
            border-color: var(--accent-sage);
            color: var(--accent-sage);
            box-shadow: 0 8px 24px var(--glow-sage);
            transform: translateY(-1px);
        }

        /* --- Footer Switcher --- */
        .auth-switch {
            text-align: center; margin-top: 32px; font-size: 0.85rem; color: var(--text-subdued);
        }
        .auth-switch span {
            color: var(--accent-lavender); cursor: pointer; font-weight: 500;
            transition: color 0.2s ease; margin-left: 4px;
        }
        .auth-switch span:hover { color: var(--text-primary); }

        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            nav { padding: 0 20px; }
            .auth-card { padding: 40px 24px; border-radius: 20px; border-left: none; border-right: none; }
        }
    </style>
</head>
<body>

    <div class="ambient-background"></div>

    <nav>
        <a href="index.html" class="brand">
            <div class="brand-dot"></div>
            BluCare+
        </a>
        <div class="nav-right">
            <div class="nav-links">
                <a href="index.html">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Back
                </a>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
                <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
            </button>
        </div>
    </nav>
    
    <main>
        <div class="auth-card">
            
            <!-- Login Form -->
            <div id="loginForm" class="auth-form active">
                <div class="auth-header">
                    <h1 class="auth-title">Welcome back</h1>
                    <p class="auth-subtitle">Take your time. You're in a safe space.</p>
                </div>

                <div class="input-group">
                    <label for="loginEmail">Email or Username</label>
                    <input type="text" id="loginEmail" class="auth-input" placeholder="Enter your email">
                </div>

                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="loginPassword" class="auth-input" placeholder="••••••••">
                        <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <a href="#" class="forgot-link">Forgot password?</a>

                <button class="auth-btn" onclick="window.location.href='chat.html'">Log in</button>

                <div class="auth-switch">
                    New to BluCare+? <span onclick="switchForm('register')">Create an account</span>
                </div>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="auth-form hidden">
                <div class="auth-header">
                    <h1 class="auth-title">Begin gently</h1>
                    <p class="auth-subtitle">Create a private space for your health journey.</p>
                </div>

                <div class="input-group">
                    <label for="regUsername">Preferred Name</label>
                    <input type="text" id="regUsername" class="auth-input" placeholder="How should we call you?">
                </div>

                <div class="input-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" class="auth-input" placeholder="For account recovery only">
                </div>

                <div class="input-group">
                    <label for="regPassword">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="regPassword" class="auth-input" placeholder="Create a strong password">
                        <button type="button" class="password-toggle" onclick="togglePassword('regPassword', this)" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button class="auth-btn" onclick="window.location.href='chat.html'">Create account</button>

                <div class="auth-switch">
                    Already have an account? <span onclick="switchForm('login')">Log in</span>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- Form Switcher Logic ---
        function switchForm(target) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            
            if (target === 'register') {
                loginForm.classList.remove('active');
                loginForm.classList.add('hidden');
                
                // Slight delay to allow fade out before fade in
                setTimeout(() => {
                    registerForm.classList.remove('hidden');
                    registerForm.classList.add('active');
                }, 200);
            } else {
                registerForm.classList.remove('active');
                registerForm.classList.add('hidden');
                
                setTimeout(() => {
                    loginForm.classList.remove('hidden');
                    loginForm.classList.add('active');
                }, 200);
            }
        }

        // --- Password Show/Hide Logic ---
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            
            if (input.type === 'password') {
                input.type = 'text';
                // Switch to eye-off icon
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
            } else {
                input.type = 'password';
                // Switch back to eye icon
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            }
        }

        // --- Theme Toggle Logic ---
        function updateThemeIcon(theme) {
            const themeIcon = document.getElementById('themeIcon');
            if (theme === 'light') {
                themeIcon.innerHTML = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
            } else {
                themeIcon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem(THEME_KEY, newTheme);
            updateThemeIcon(newTheme);
        }

        // Initialize theme icon on load
        updateThemeIcon(document.documentElement.getAttribute('data-theme') || 'dark');
    </script>
</body>
</html>
