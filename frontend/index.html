<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f12" />

    <!-- SEO Meta Tags -->
    <title>BluCare+ | AI Healthcare Assistant & Emergency Ambulance Dispatch</title>
    <meta
      name="description"
      content="BluCare+ is an AI-powered healthcare assistant providing intelligent diagnostic evaluation, medical RAG, symptom analysis, and instant 24/7 ambulance emergency dispatch."
    />
    <meta name="keywords" content="BluCare, AI Healthcare, Medical Assistant, Ambulance Assistance, Emergency Dispatch, RAG Diagnostics" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blucare.ai/" />
    <meta property="og:title" content="BluCare+ | AI Healthcare Assistant & Emergency Ambulance Dispatch" />
    <meta
      property="og:description"
      content="BluCare+ harmonizes medical precision with empathetic understanding, providing a safe and intelligent workspace for your health journey."
    />
    <meta property="og:image" content="/images/abt1.webp" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://blucare.ai/" />
    <meta name="twitter:title" content="BluCare+ | AI Healthcare Assistant" />
    <meta
      name="twitter:description"
      content="Advanced Diagnostics. Gentle Human Care. Powered by Clinical AI Intelligence."
    />
    <meta name="twitter:image" content="/images/abt1.webp" />

    <!-- Prevent Flash of Unstyled Theme -->
    <script>
      const THEME_KEY = 'blucare_theme';
      const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
