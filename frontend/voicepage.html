<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BluCare+</title>
    
    <!-- Prevent Flash of Unstyled Theme -->
    <script>
        const THEME_KEY = 'blucare_theme';
        const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Standard Dark Theme (Default) */
            --bg-base: #0F0F12;
            --bg-surface: #15151A;
            --bg-card: #1B1B22;
            --accent-sage: #7FE1C3;
            --accent-lavender: #B6C4FF;
            --accent-aqua: #A3E8ED;
            --text-primary: #ECECF1;
            --text-secondary: #B8BAC7;
            --text-subdued: #8A8D9E;
            --status-normal: #8FE3B0;
            --status-risk: #F29B9B;
            --shadow-base: 0 12px 40px rgba(0, 0, 0, 0.4);

            /* Component Backgrounds & Borders */
            --nav-bg: rgba(15, 15, 18, 0.8);
            --ai-bubble-bg: rgba(127, 225, 195, 0.06);
            --ai-bubble-border: rgba(127, 225, 195, 0.12);
            --user-bubble-bg: rgba(182, 196, 255, 0.06);
            --user-bubble-border: rgba(182, 196, 255, 0.12);
            --input-bg: #18181F;
            --border-light: rgba(255, 255, 255, 0.05);
            --btn-hover-bg: rgba(255, 255, 255, 0.1);
            --tag-bg: rgba(182, 196, 255, 0.1);
            --badge-bg: rgba(143, 227, 176, 0.1);

            /* Glows & Hover States */
            --glow-sage: rgba(127, 225, 195, 0.4);
            --glow-lavender: rgba(182, 196, 255, 0.4);
            --glow-normal: rgba(143, 227, 176, 0.5);
            --hover-lavender: rgba(182, 196, 255, 0.1);
        }

        [data-theme="light"] {
            /* Crisp Light Theme */
            --bg-base: #F8FAFC;
            --bg-surface: #F1F5F9;
            --bg-card: #FFFFFF;
            --accent-sage: #14B8A6;
            --accent-lavender: #6366F1;
            --accent-aqua: #06B6D4;
            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-subdued: #64748B;
            --status-normal: #10B981;
            --status-risk: #EF4444;
            --shadow-base: 0 12px 40px rgba(0, 0, 0, 0.05);

            /* Component Backgrounds & Borders */
            --nav-bg: rgba(248, 250, 252, 0.85);
            --ai-bubble-bg: rgba(20, 184, 166, 0.08);
            --ai-bubble-border: rgba(20, 184, 166, 0.2);
            --user-bubble-bg: rgba(99, 102, 241, 0.08);
            --user-bubble-border: rgba(99, 102, 241, 0.2);
            --input-bg: #FFFFFF;
            --border-light: rgba(15, 23, 42, 0.08);
            --btn-hover-bg: rgba(15, 23, 42, 0.05);
            --tag-bg: rgba(99, 102, 241, 0.1);
            --badge-bg: rgba(16, 185, 129, 0.1);

            /* Glows & Hover States */
            --glow-sage: rgba(20, 184, 166, 0.4);
            --glow-lavender: rgba(99, 102, 241, 0.4);
            --glow-normal: rgba(16, 185, 129, 0.4);
            --hover-lavender: rgba(99, 102, 241, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- Navigation --- */
        nav {
            position: fixed; top: 0; left: 0; right: 0; height: 80px; padding: 0 40px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 100; background: var(--nav-bg); backdrop-filter: blur(10px);
            transition: background-color 0.3s ease;
        }

        .brand {
            font-weight: 500; font-size: 1.1rem; letter-spacing: -0.01em;
            color: var(--text-primary); display: flex; align-items: center; gap: 12px;
        }

        /* Responsive Status Dot */
        .brand-dot {
            width: 8px; height: 8px; background: var(--accent-sage); border-radius: 50%;
            box-shadow: 0 0 15px var(--glow-sage);
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }
        .brand-dot.typing { background: var(--accent-lavender); box-shadow: 0 0 15px var(--glow-lavender); }
        .brand-dot.generating { background: var(--status-normal); box-shadow: 0 0 15px var(--glow-normal); }

        .nav-right { display: flex; align-items: center; gap: 40px; }
        .nav-links { display: flex; align-items: center; gap: 32px; }
        .nav-links a {
            color: var(--text-subdued); text-decoration: none; font-size: 0.9rem;
            transition: color 0.3s ease; cursor: pointer;
        }
        .nav-links a:hover { color: var(--accent-lavender); }

        .theme-toggle {
            background: transparent; border: none; color: var(--text-subdued);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: color 0.3s ease; margin-left: 12px;
        }
        .theme-toggle:hover { color: var(--accent-lavender); }
        .theme-toggle svg { width: 18px; height: 18px; }

        /* --- Logged-in User Display --- */
        .user-profile {
            display: flex; align-items: center; gap: 12px; padding-left: 24px;
            border-left: 1px solid var(--border-light);
        }

        .user-avatar {
            width: 32px; height: 32px; border-radius: 50%; background: var(--ai-bubble-bg);
            color: var(--accent-sage); display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-weight: 500; border: 1px solid var(--ai-bubble-border); flex-shrink: 0;
        }

        .user-name { font-size: 0.85rem; color: var(--text-secondary); font-weight: 400; white-space: nowrap; }

        /* --- Conversation Container --- */
        .container {
            width: 100%; max-width: 900px; height: 100vh; display: flex; flex-direction: column;
            padding-top: 100px; padding-bottom: 40px; position: relative;
        }

        .chat-area {
            flex-grow: 1; overflow-y: auto; padding: 20px;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            scrollbar-width: none;
        }
        .chat-area::-webkit-scrollbar { display: none; }

        /* --- Message Styles & Layout --- */
        .message {
            margin-bottom: 32px; opacity: 0; transform: translateY(10px);
            animation: softFadeIn 0.4s ease forwards; display: flex; flex-direction: column;
        }

        @keyframes softFadeIn { to { opacity: 1; transform: translateY(0); } }

        .speaker-label {
            font-size: 0.75rem; color: var(--text-subdued); margin-bottom: 8px;
            padding: 0 4px; font-weight: 500; letter-spacing: 0.02em;
        }

        .ai-message { align-items: flex-start; }
        .ai-bubble {
            background-color: var(--ai-bubble-bg); padding: 24px; border-radius: 24px;
            line-height: 1.7; font-size: 1rem; color: var(--text-primary);
            box-shadow: var(--shadow-base); max-width: 70%; 
            border: 1px solid var(--ai-bubble-border);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .user-message { align-items: flex-end; }
        .user-bubble {
            background-color: var(--user-bubble-bg); padding: 24px; border-radius: 24px;
            line-height: 1.7; font-size: 1rem; color: var(--text-primary);
            box-shadow: var(--shadow-base); max-width: 70%; 
            border: 1px solid var(--user-bubble-border); text-align: left; 
            display: flex; flex-direction: column; gap: 12px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .clamped-text {
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
            overflow: hidden; word-break: break-word; transition: all 0.3s ease;
        }
        .clamped-text.expanded { -webkit-line-clamp: unset; }

        .expand-toggle {
            background: transparent; border: none; color: var(--text-subdued);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            padding-top: 4px; transition: color 0.2s ease;
        }
        .expand-toggle:hover { color: var(--accent-lavender); }
        .expand-toggle svg { transition: transform 0.3s ease; }
        .expand-toggle.expanded svg { transform: rotate(180deg); }

        .voice-tag {
            display: inline-flex; align-items: center; justify-content: center;
            height: 28px; border-radius: 14px; padding: 0 12px; gap: 6px; font-size: 0.8rem;
            background: var(--tag-bg); color: var(--accent-lavender); width: fit-content;
        }

        .status-badge {
            display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; 
            color: var(--status-normal); margin-bottom: 12px; background: var(--badge-bg); 
            padding: 4px 12px; border-radius: 12px;
        }

        /* --- Input Section & Layered Glow --- */
        .input-section { position: relative; padding: 0 20px; }
        .input-glow { position: relative; margin: 0 20px; border-radius: 32px; z-index: 1; }

        .input-glow::before {
            content: ''; position: absolute; inset: -2px; border-radius: 34px;
            background: linear-gradient(90deg, var(--accent-sage), var(--accent-lavender), var(--accent-aqua), var(--accent-sage));
            background-size: 300% 100%; filter: blur(14px); opacity: 0.15;
            z-index: -1; transition: opacity 0.4s ease, filter 0.4s ease;
            animation: flowGradient 6s linear infinite; pointer-events: none;
        }

        @keyframes flowGradient { 0% { background-position: 0% 50%; } 100% { background-position: 150% 50%; } }

        .input-glow:focus-within::before, .input-glow.active-listening::before {
            opacity: 0.45; filter: blur(18px); 
        }

        .input-wrapper {
            background-color: var(--input-bg); border-radius: 32px; padding: 8px 12px;
            display: flex; align-items: flex-end; 
            border: 1px solid var(--border-light);
            position: relative; z-index: 2; box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            transition: background-color 0.3s;
        }

        .upload-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent; 
            color: var(--text-subdued); cursor: pointer; display: flex; align-items: center; 
            justify-content: center; transition: all 0.2s ease; margin: 4px 4px 4px 0; flex-shrink: 0;
        }
        .upload-btn:hover { background: var(--border-light); color: var(--text-primary); }

        .input-core { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }

        .file-indicator {
            display: none; align-items: center; gap: 8px; font-size: 0.75rem;
            color: var(--accent-lavender); background: var(--tag-bg);
            padding: 4px 10px; border-radius: 6px; margin: 4px 16px 0 16px; width: fit-content;
        }
        .remove-file { cursor: pointer; color: var(--text-subdued); font-size: 1rem; line-height: 1;}
        .remove-file:hover { color: var(--status-risk); }

        /* Auto-Growing Textarea */
        textarea {
            width: 100%; background: transparent; border: none; padding: 12px 16px;
            color: var(--text-primary); font-family: inherit; font-size: 1rem;
            resize: none; outline: none; overflow-y: hidden;
            min-height: 44px; max-height: 150px; line-height: 1.4;
        }
        textarea::placeholder { color: var(--text-subdued); }

        /* --- Action Buttons --- */
        .actions-container { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-bottom: 2px; }
        .mic-btn, .send-btn {
            width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;
        }
        .mic-btn { background: transparent; color: var(--text-subdued); }
        .mic-btn:hover { background: var(--hover-lavender); color: var(--accent-lavender); }
        .send-btn { background-color: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-light); transition: background-color 0.3s; }
        .send-btn:hover { transform: scale(1.05); background-color: var(--bg-surface); color: var(--accent-sage); }

        .footer-note { text-align: center; font-size: 0.75rem; color: var(--text-subdued); margin-top: 24px; font-weight: 300; }
        
        .history-toast {
            position: absolute; top: 80px; right: 40px; background: var(--bg-card);
            border: 1px solid var(--border-light); padding: 12px 20px; border-radius: 8px;
            color: var(--text-secondary); font-size: 0.85rem; box-shadow: var(--shadow-base);
            opacity: 0; transform: translateY(-10px); transition: all 0.3s ease; pointer-events: none;
            z-index: 200;
        }
        .history-toast.show { opacity: 1; transform: translateY(0); }

        /* =========================================
           RESTORED: VOICE MODE IMMERSIVE OVERLAY
           ========================================= */
        .voice-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-base); z-index: 500;
            display: flex; flex-direction: column; opacity: 0; pointer-events: none;
            transition: opacity 0.6s ease, background-color 0.3s ease;
        }
        .voice-overlay.active { opacity: 1; pointer-events: all; }

        .voice-bg-glow {
            position: absolute; inset: -20%; z-index: -1;
            background: linear-gradient(120deg, var(--accent-sage), var(--accent-lavender), var(--accent-aqua), var(--accent-sage));
            background-size: 300% 300%; filter: blur(120px); opacity: 0.1;
            transition: opacity 1s ease, filter 1s ease;
            animation: flowGradient 12s ease-in-out infinite alternate;
        }
        .voice-overlay[data-state="listening"] .voice-bg-glow { opacity: 0.25; filter: blur(90px); }
        .voice-overlay[data-state="speaking"] .voice-bg-glow { opacity: 0.35; filter: blur(100px); }

        .voice-header { display: flex; justify-content: space-between; align-items: center; padding: 40px; z-index: 2; }
        .close-voice-btn { background: var(--border-light); border: 1px solid var(--border-light); color: var(--text-secondary); width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
        .close-voice-btn:hover { background: var(--btn-hover-bg); color: var(--text-primary); }

        .voice-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px; max-width: 800px; margin: 0 auto; z-index: 2; }
        .voice-speaker-name { font-size: 0.85rem; color: var(--text-subdued); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 24px; font-weight: 500; opacity: 0; transition: opacity 0.4s ease; }
        .voice-speaker-name.visible { opacity: 1; }
        .voice-main-text { font-size: 2.2rem; font-weight: 300; line-height: 1.4; color: var(--text-primary); opacity: 0; transform: translateY(10px); transition: opacity 0.6s ease, transform 0.6s ease; }
        .voice-main-text.visible { opacity: 1; transform: translateY(0); }

        .voice-controls { padding: 60px 40px; display: flex; flex-direction: column; align-items: center; z-index: 2; }
        .voice-status-text { font-size: 0.85rem; color: var(--text-subdued); margin-top: 24px; transition: color 0.3s; }

        .big-mic-btn { width: 80px; height: 80px; border-radius: 50%; border: 1px solid var(--border-light); cursor: pointer; display: flex; align-items: center; justify-content: center; background: var(--border-light); color: var(--text-primary); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .voice-overlay[data-state="listening"] .big-mic-btn { background: var(--hover-lavender); color: var(--accent-lavender); border-color: var(--accent-lavender); box-shadow: 0 0 0 0 var(--glow-lavender); animation: pulse-listening 2s infinite; }
        @keyframes pulse-listening { 0% { box-shadow: 0 0 0 0 var(--glow-lavender); } 70% { box-shadow: 0 0 0 20px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
        .voice-overlay[data-state="speaking"] .big-mic-btn { background: var(--ai-bubble-bg); color: var(--accent-sage); border-color: var(--ai-bubble-border); }

        /* --- Responsiveness --- */
        @media (max-width: 768px) {
            nav { padding: 0 20px; } .nav-right { gap: 16px; } .nav-links { display: none; }
            .user-profile { padding-left: 0; border-left: none; } .user-name { display: none; } 
            .container { padding-top: 80px; } .chat-area { padding: 20px 10px; }
            .ai-bubble, .user-bubble { max-width: 90%; padding: 16px; }
            .input-section { padding: 0 10px; } .input-glow { margin: 0; }
            .voice-main-text { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="brand">
            <div class="brand-dot" id="statusDot"></div>
            BluCare+
        </div>
        <div class="nav-right">
            <div class="nav-links">
                <a onclick="startNewSession()">New Session</a>
                <a onclick="startTemporarySession()">Temporary Session</a>
                <a onclick="showHistoryToast()">My Journal</a>
                
                <!-- Theme Toggle Button -->
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
                    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
                </button>
            </div>
            
            <div class="user-profile">
                <div class="user-avatar">P</div>
                <div class="user-name">Hi, Prashik</div>
            </div>
        </div>
    </nav>
    
    <div class="history-toast" id="historyToast">Saved sessions loaded.</div>

    <!-- MAIN CHAT CONTAINER -->
    <div class="container" id="chatContainer">
        <section class="chat-area" id="chatArea"></section>

        <section class="input-section">
            <div class="input-glow" id="inputGlow">
                <div class="input-wrapper">
                    
                    <button class="upload-btn" id="uploadBtn" title="Attach file">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                    <!-- Hidden native file input -->
                    <input type="file" id="filePicker" style="display: none;" accept="image/*,.pdf,.txt">

                    <div class="input-core">
                        <div class="file-indicator" id="fileIndicator">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                            <span id="fileName">document.pdf</span>
                            <span class="remove-file" id="removeFile">&times;</span>
                        </div>
                        <textarea id="chatInput" placeholder="Message Yukti..." rows="1"></textarea>
                    </div>
                    
                    <div class="actions-container">
                        <!-- Mic Button Triggers Voice Mode Overlay -->
                        <button class="mic-btn" title="Voice Assistant" onclick="openVoiceMode()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                <line x1="12" y1="19" x2="12" y2="22"></line>
                            </svg>
                        </button>
                        
                        <button class="send-btn" id="sendBtn" title="Send Message">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <p class="footer-note">A safe, private space for your health journey.</p>
        </section>
    </div>

    <!-- VOICE MODE OVERLAY -->
    <div class="voice-overlay" id="voiceModeOverlay" data-state="idle">
        <div class="voice-bg-glow"></div>
        
        <div class="voice-header">
            <div class="brand">
                <div class="brand-dot" style="box-shadow: none;"></div>
                BluCare+ Voice
            </div>
            <button class="close-voice-btn" onclick="closeVoiceMode()" title="Return to text chat">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="voice-content">
            <div class="voice-speaker-name" id="voiceSpeakerName">Yukti</div>
            <div class="voice-main-text" id="voiceMainText">Initializing...</div>
        </div>

        <div class="voice-controls">
            <button class="big-mic-btn" id="bigMicBtn" onclick="toggleVoiceState()">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="22"></line>
                </svg>
            </button>
            <div class="voice-status-text" id="voiceStatusText">Tap to interact</div>
        </div>
    </div>

    <!-- VANILLA JS LOGIC -->
    <script>
        // --- THEME TOGGLE LOGIC ---
        function updateThemeIcon(theme) {
            const themeIcon = document.getElementById('themeIcon');
            if (theme === 'light') {
                themeIcon.innerHTML = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
            } else {
                themeIcon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem(THEME_KEY, newTheme);
            updateThemeIcon(newTheme);
        }

        updateThemeIcon(document.documentElement.getAttribute('data-theme') || 'dark');


        // --- CHAT STATE & LOGIC ---
        const STORAGE_KEY = 'blucare_chat_history';
        let appState = { sessions:[], currentSessionId: null };

        const defaultGreeting = "Hello, I'm Yukti. I'm here to listen and help you navigate how you're feeling today. Take your time—whenever you're ready, you can type, upload a file, or speak to me.";

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) appState = JSON.parse(saved);
        }

        function saveState() {
            const stateToSave = { ...appState, sessions: appState.sessions.filter(s => !s.isTemporary) };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToSave));
        }

        function cleanTempSessions() { appState.sessions = appState.sessions.filter(s => !s.isTemporary); }

        function initApp() {
            loadState(); cleanTempSessions(); 
            if (appState.sessions.length === 0) startNewSession();
            else { appState.currentSessionId = appState.sessions[appState.sessions.length - 1].id; renderChat(); }
        }

        function startNewSession() {
            cleanTempSessions();
            const newSession = { id: 'sess_' + Date.now(), timestamp: Date.now(), isTemporary: false, messages:[{ role: 'ai', content: defaultGreeting }] };
            appState.sessions.push(newSession); appState.currentSessionId = newSession.id;
            saveState(); renderChat();
        }

        function startTemporarySession() {
            cleanTempSessions();
            const tempSession = { id: 'temp_' + Date.now(), timestamp: Date.now(), isTemporary: true, messages:[{ role: 'ai', content: "This is a Temporary Session. Messages here are not saved and will be deleted when you leave or refresh." }] };
            appState.sessions.push(tempSession); appState.currentSessionId = tempSession.id;
            renderChat();
        }

        window.toggleMessageExpand = function(index) {
            const session = appState.sessions.find(s => s.id === appState.currentSessionId);
            if(session && session.messages[index]) {
                session.messages[index].expanded = !session.messages[index].expanded; renderChat();
            }
        };

        const chatArea = document.getElementById('chatArea');

        function renderChat() {
            const currentSession = appState.sessions.find(s => s.id === appState.currentSessionId);
            chatArea.innerHTML = ''; 
            if (!currentSession) return;

            currentSession.messages.forEach((msg, index) => {
                const wrapper = document.createElement('div'); wrapper.className = `message ${msg.role}-message`;

                if (msg.role === 'ai') {
                    wrapper.innerHTML = `<div class="speaker-label">Yukti</div><div class="ai-bubble">${msg.content}</div>`;
                } else {
                    let attachmentHtml = msg.attachment ? `<div class="voice-tag" title="Attached File"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg> ${msg.attachment}</div>` : '';
                    const isLongText = msg.content.length > 250;
                    const textClasses = `clamped-text ${msg.expanded ? 'expanded' : ''}`;
                    const toggleBtn = isLongText ? `<button class="expand-toggle ${msg.expanded ? 'expanded' : ''}" onclick="toggleMessageExpand(${index})"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>` : '';

                    wrapper.innerHTML = `<div class="speaker-label">Prashik</div><div class="user-bubble"><div class="${isLongText ? textClasses : ''}">${msg.content}</div>${attachmentHtml}${toggleBtn}</div>`;
                }
                chatArea.appendChild(wrapper);
            });
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        /* --- TEXT INPUT LOGIC --- */
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const inputGlow = document.getElementById('inputGlow');
        const statusDot = document.getElementById('statusDot');
        let pendingFile = null;

        chatInput.addEventListener('input', function() {
            this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px';
            this.style.overflowY = this.scrollHeight > 150 ? 'auto' : 'hidden';
            statusDot.className = this.value.trim().length > 0 ? 'brand-dot typing' : 'brand-dot'; 
        });

        function handleSend() {
            const text = chatInput.value.trim();
            if (!text && !pendingFile) return;

            const session = appState.sessions.find(s => s.id === appState.currentSessionId);
            session.messages.push({ role: 'user', content: text, attachment: pendingFile ? pendingFile.name : null, expanded: false });
            
            chatInput.value = ''; chatInput.style.height = 'auto'; chatInput.style.overflowY = 'hidden';
            clearFile(); if(!session.isTemporary) saveState(); renderChat();

            inputGlow.classList.add('active-listening'); statusDot.className = 'brand-dot generating';

            setTimeout(() => {
                session.messages.push({ role: 'ai', content: "I'm listening carefully. Take a deep breath, I'm here to help you work through this. Could you tell me a little more about what's on your mind?" });
                if(!session.isTemporary) saveState(); renderChat();
                inputGlow.classList.remove('active-listening'); statusDot.className = 'brand-dot';
            }, 1500);
        }

        sendBtn.addEventListener('click', handleSend);
        chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });

        /* --- FILE UPLOAD LOGIC --- */
        const uploadBtn = document.getElementById('uploadBtn'), filePicker = document.getElementById('filePicker'), fileIndicator = document.getElementById('fileIndicator'), fileName = document.getElementById('fileName'), removeFile = document.getElementById('removeFile');
        uploadBtn.addEventListener('click', () => filePicker.click());
        filePicker.addEventListener('change', (e) => { if (e.target.files.length > 0) { pendingFile = e.target.files[0]; fileName.textContent = pendingFile.name; fileIndicator.style.display = 'flex'; }});
        function clearFile() { pendingFile = null; filePicker.value = ''; fileIndicator.style.display = 'none'; }
        removeFile.addEventListener('click', clearFile);

        window.showHistoryToast = function() {
            const realSessions = appState.sessions.filter(s => !s.isTemporary).length;
            const toast = document.getElementById('historyToast');
            toast.textContent = `Journal active. You have ${realSessions} saved sessions.`;
            toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000);
        }

        /* =========================================
           VOICE MODE LOGIC (TTS & STT)
           ========================================= */
        const voiceOverlay = document.getElementById('voiceModeOverlay');
        const voiceSpeakerName = document.getElementById('voiceSpeakerName');
        const voiceMainText = document.getElementById('voiceMainText');
        const voiceStatusText = document.getElementById('voiceStatusText');
        
        let synth = window.speechSynthesis;
        let recognition = null;
        let isVoiceModeActive = false;
        let mockTimeout = null;

        // Initialize Speech Recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            
            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        handleVoiceUserInput(event.results[i][0].transcript);
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                        setVoiceText('Prashik', interimTranscript + '...');
                    }
                }
            };
            recognition.onerror = () => { simulateUserVoice(); };
        }

        function setVoiceOverlayState(state, statusText) {
            voiceOverlay.setAttribute('data-state', state);
            voiceStatusText.innerText = statusText;
        }

        function setVoiceText(speaker, text) {
            voiceMainText.classList.remove('visible');
            voiceSpeakerName.classList.remove('visible');
            
            setTimeout(() => {
                voiceSpeakerName.innerText = speaker;
                voiceMainText.innerText = text;
                voiceSpeakerName.classList.add('visible');
                voiceMainText.classList.add('visible');
            }, 300);
        }

        function openVoiceMode() {
            isVoiceModeActive = true;
            voiceOverlay.classList.add('active');
            speakYukti("Hello Prashik. I'm here. How are you feeling right now?");
        }

        function closeVoiceMode() {
            isVoiceModeActive = false;
            if (synth) synth.cancel();
            if (recognition) recognition.stop();
            clearTimeout(mockTimeout);
            voiceOverlay.classList.remove('active');
            setVoiceOverlayState('idle', 'Tap to interact');
        }

        function speakYukti(text) {
            setVoiceOverlayState('speaking', 'Yukti is speaking...');
            setVoiceText('Yukti', text);

            // Log AI speech to normal chat history
            const session = appState.sessions.find(s => s.id === appState.currentSessionId);
            session.messages.push({ role: 'ai', content: text });
            if(!session.isTemporary) saveState(); renderChat();

            if (synth) {
                synth.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = 1.0; utterance.rate = 0.95; 
                utterance.onend = () => { if (isVoiceModeActive) startListening(); };
                synth.speak(utterance);
            } else {
                setTimeout(() => { if (isVoiceModeActive) startListening(); }, 3000);
            }
        }

        function startListening() {
            setVoiceOverlayState('listening', 'Listening...');
            setVoiceText('Prashik', '...');
            
            if (recognition) {
                try { recognition.start(); } 
                catch(e) { simulateUserVoice(); }
            } else {
                mockTimeout = setTimeout(simulateUserVoice, 4000);
            }

            // Fallback safety: if no speech detected after 6s
            mockTimeout = setTimeout(() => {
                if(voiceOverlay.getAttribute('data-state') === 'listening' && voiceMainText.innerText === '...') {
                    if(recognition) recognition.stop();
                    simulateUserVoice();
                }
            }, 6000);
        }

        function handleVoiceUserInput(text) {
            clearTimeout(mockTimeout);
            setVoiceOverlayState('idle', 'Processing...');
            setVoiceText('Prashik', text);

            // Log User speech to normal chat history
            const session = appState.sessions.find(s => s.id === appState.currentSessionId);
            session.messages.push({ role: 'user', content: text, expanded: false });
            if(!session.isTemporary) saveState(); renderChat();

            setTimeout(() => {
                speakYukti("I hear you. It's completely normal to feel that way. I'm right here with you.");
            }, 1500);
        }

        function simulateUserVoice() { handleVoiceUserInput("I've just been feeling a little overwhelmed lately."); }

        function toggleVoiceState() {
            const currentState = voiceOverlay.getAttribute('data-state');
            if (currentState === 'listening') {
                if(recognition) recognition.stop();
                setVoiceOverlayState('idle', 'Paused');
            } else if (currentState === 'speaking') {
                if(synth) synth.cancel(); startListening();
            } else { startListening(); }
        }

        window.onload = initApp;
    </script>
</body>
</html>
